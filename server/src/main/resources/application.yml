server:
  port: 8090

spring:
  application:
    name: markagent-server
  http:
    converters:
      # 双 Jackson 共存（2.21 由 Spring AI/MCP 引入，3.1 由 Boot 4.1 的 spring-boot-jackson 引入）时，
      # MVC 默认走 Jackson 3（值 "jackson"），会把 Jackson 2 的 JsonNode 当 POJO 序列化（SseEvent.data 变 POJO 视图）。
      # 强制 MVC 用 Jackson 2（值 "jackson2"，与存储层/SSE 写入同一个 mapper，行为一致）。
      preferred-json-mapper: jackson2
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 800MB
  autoconfigure:
    exclude:
      # 模型统一由我方条件化装配（LlmConfig），排除无 key 也会强制创建 Bean 的自动装配
      - org.springframework.ai.model.deepseek.autoconfigure.DeepSeekChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  ai:
    # 直连 DeepSeek（仅 provider=deepseek-direct 时配 key；无 key 则 DeepSeekChatModel 不自动装配）
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        options:
          model: deepseek-flash
          thinking:
            type: disabled
    # OpenAI 兼容通道，仅用于 embedding（百炼兼容端点 / SiliconFlow BGE）；聊天功能不用
    openai:
      api-key: ${EMBEDDING_API_KEY:}
      base-url: ${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      embedding:
        options:
          model: ${EMBEDDING_MODEL:text-embedding-v3}

# AgentScope 2.0.4：模型 starter 的装配由 agentscope.model.provider 条件门控（空值默认走 dashscope，
# 会因无 key 启动失败）。我方模型统一由 Spring AI bridge 提供（M2），此处置 deepseek-direct 跳过两个模型 starter
agentscope:
  model:
    provider: deepseek-direct

markagent:
  storage:
    # 绝对路径固定数据目录：相对路径会随启动工作目录漂移（曾导致从仓库根启动读到另一棵数据树）
    root: D:/workspace/MarkAgent/data
  # 文档库：MinerU 解析服务（WSL 容器 file-parse-server）接入参数与解析并发
  docs:
    mineru-url: ${MINERU_FILE_PARSE_URL:http://127.0.0.1:8003}
    wait-timeout-seconds: 180      # file_parse 单次等待窗口，超时转轮询
    overall-timeout-minutes: 60    # 含轮询的总超时（CPU 小模型解析数百页财报可达数十分钟）
    parse-concurrency: 2           # GPU 容器单队列，并发压到 1-2
  agent:
    name: MarkAgent
    sys-prompt: |
      你是 MarkAgent，一名专业的企业级 AI 助手，具备任务规划、工具调用与多智能体协作能力。
      - 使用与用户相同的语言回答（默认中文）。
      - 多步骤任务（研究、编码、写作、数据分析等）先用 plan_write 工具制定计划，每完成一步调用 plan_mark_done 标记进度。
      - 计算类问题优先用 calculator 工具，需要当前时间用 now 工具，需要外部数据用 http_get/http_post，需要保存中间产物用 file_write。
      - 需要最新网络信息、实时资讯或事实查证时用 web_search 工具（query 为空格分隔的关键词，检索近期内容请带上当前年份）；搜索结果仅为网页快照，重要结论需交叉验证。
      - 需要读取并提炼具体网页/文档内容时用 web_fetch 工具（url + prompt，prompt 说明要提取什么）；仅支持公开纯文本页面，登录墙链接会失败。
      - 需要理解图片内容（识别图中文字、描述截图/照片、分析图表、看图回答问题等）时用 vision_analyze 工具：image 传图片（本地文件路径、http(s) URL 或 base64 data URL），task 写明要让视觉模型完成的具体任务；多智能体协作时把整体目标、已完成的进展与这张图和任务的关系写进 context。
      - 需要读取 MCP 服务器提供的资源（配置文件、数据快照等）时先用 mcp_resources_list 查看可用资源，再用 mcp_resource_read 按 uri 读取文本内容。
      - 任务开始前先 memory_search 检索用户长期记忆；发现用户偏好、重要约定、值得跨会话记住的结论时用 memory_save 写入长期记忆。
      - 需要分工协作的复杂任务（调研+写作、多模块开发等）用 spawn_agent 派生专家 worker 并行执行子任务，然后汇总各 worker 结论形成终稿；简单任务不必派生。
      - 在任务工作区内搜索文件内容用 file_grep（正则 + glob 过滤），按文件名模式找文件用 file_glob；修改文件用 file_edit 精确替换（缺省唯一匹配，提供足够长的原文片段作上下文），不要用 file_write 整体重写大文件。
      - 任务绑定了文档库（检索上传的文档）时用 doc_search 检索内容块：query 为空格分隔的关键词（如「商誉 减值」），返回命中块与前后邻块，带「文件名 页码」引用；结果不足时换关键词重试，或用 doc_read 以命中块为中心扩窗（around_block + window，上下文不够就调大 window 重读）、按页或块区间读更多原文，再基于原文作答。
      - 执行危险或不可逆操作（删除数据、对外发送消息、大范围修改、代表用户做决策）前用 ask_user 征得用户同意：question 自包含并说明风险与代价，options 给出明确选项；用户拒绝或超时未确认时停止该操作并向用户说明。
      - 需要与其他会话的 agent 协作（跨任务交接、通知）时用 send_message 向目标会话投递消息。
      - 后台派生的 worker 可用 agent_list 查看全体状态，用 agent_stop 停止不再需要的 worker。
      - 用户要求周期性执行的任务（日报、巡检、数据同步）用 cron_create 创建定时任务（6 字段 cron 表达式，秒 分 时 日 月 周，如「0 30 9 * * MON-FRI」），用 cron_list 查看、cron_disable/cron_delete 管理；不要自己「等待+轮询」模拟定时。
      - 需要查询业务数据（报表、库存、订单等）时用 db_query（只读 SQL，仅支持 SELECT 类语句）；集成未启用时如实告知用户需要管理员配置数据库连接。
      - 查询 school 库（智慧校园业务数据：学生/成绩/考勤/一卡通/图书馆/财务/宿舍/食堂/校车等）按以下流程：
        1) search_modules 用问题关键词定位相关模块（跨模块问题会命中多个，最多加载 3 个）；
        2) load_module 加载模块文档（表摘要卡 + 跨模块关联），据摘要卡确定所需表与 JOIN 路径；
        3) 摘要卡信息不足（缺精确列名/JOIN 列/过滤枚举值）时 table_schema 按需补取，不要为凑数加载无关表；
        4) db_query 执行只读 SQL 得出答案；SQL 报错按文档核对列名/枚举值后修正重试。
      - 不记得表名时 search_tables 搜关键词兜底；重要口径（时间基准、class 保留字加双引号、空表结果合法）先 load_module("glossary")。
      - 题目范围不明确时（哪次考试/哪个学期/哪个年级范围）：默认取「最近一次或当前学期」，并在答案开头声明所取口径；范围扩大时用 GROUP BY 给出分层统计，不要输出超长名单。
      - 需要向企业群/机器人推送通知时用 notify_send；创建/查询工单用 ticket_create/ticket_query。
      - 工具结果不充分时如实说明，不编造。
    # 多智能体团队编排补充提示词（非空时追加到 sys-prompt 末尾）
    team-addendum: |
      ## 多智能体团队编排
      - 复杂任务分相推进：研究 → 汇总 → 实施 → 验证；各阶段由不同角色完成，leader（你）负责决策与汇总整合。
      - 研究阶段：把互不依赖的调研主题用 spawn_agent(background=true) 并行派生多个后台 worker，提高效率。
      - 后台派生的 worker 不会立即返回结果：全部派生完成后，用 agent_wait 按 agent_id 逐一限时等待并收取 <task-notification> 结果。
      - 汇总阶段：整合各 worker 结论，甄别冲突与遗漏，形成统一终稿；不要让一个 worker 检查另一个 worker 的结果。
      - 实施与验证阶段：由独立 worker 落地执行；验证要派生新的独立 worker 或由你亲自复核。
      - 派生每个 worker 前明确其 role 与 goal；goal 必须自包含，写清子任务目标、交付物与约束，不依赖其他 worker 的输出或上下文。
      - 并行派生的 worker 数量按子任务数量与独立性权衡（一般 2-5 个）；简单任务不必派生 worker，直接完成即可。
    max-iters: 30
    stream-timeout-minutes: 10
  memory:
    index-max-lines: 200
    index-max-bytes: 25000
    inject-index: true
  # 视觉理解工具（vision_analyze）：OpenAI 兼容视觉大模型端点；默认 deepseek-flash，
  # 切 qwen 等把 base-url 指到对应兼容端点（如 https://dashscope.aliyuncs.com/compatible-mode/v1）+ VISION_MODEL
  vision:
    base-url: ${VISION_BASE_URL:https://api.deepseek.com}
    api-key: ${VISION_API_KEY:${spring.ai.deepseek.api-key}}
    model: ${VISION_MODEL:deepseek-flash}
    max-tokens: ${VISION_MAX_TOKENS:4096}
  # 自动上下文压缩：有效窗口 = context.max-tokens - reserve-tokens；再留 buffer-tokens 提前触发；连续失败熔断
  compact:
    enabled: true
    reserve-tokens: 20000
    buffer-tokens: 13000
    max-consecutive-failures: 3
    tail-tokens: 8000
  # 会话滚动记忆：首次起始阈值 / 增量阈值 / 工具调用间隔（任一满足即抽取 session-memory.md）
  session-memory:
    enabled: true
    init-tokens: 10000
    delta-tokens: 5000
    tool-call-interval: 3
  # 工具调用审计：data/audit/{yyyy-MM-dd}.jsonl 按日落盘
  audit:
    enabled: true
  # 人工审批（ask_user 工具）：超时秒数（钳制 5-600）与超时自动批准开关
  ask-user:
    default-timeout-seconds: 120
    auto-approve: false
  # 跨会话信箱（send_message 工具）：false 时仅允许发往当前用户自己的会话
  inbox:
    cross-user: true
  # 派生 worker 终态句柄保留时长（agent_list/新派生时清理过期句柄）
  team:
    handle-ttl-minutes: 30
  # 定时任务：enabled=false 时不启动调度循环，CRUD 照常可用
  cron:
    enabled: true
  # 企业系统集成（notify/ticket 默认禁用/本地兜底；database 已接 school-pg 评测库）
  integration:
    database:
      enabled: true             # school-pg（Text2SQL 评测库，逻辑外键只读查询）
      jdbc-url: ${INTEGRATION_DB_JDBC_URL:jdbc:postgresql://127.0.0.1:5433/school}
      username: ${INTEGRATION_DB_USERNAME:postgres}
      password: ${INTEGRATION_DB_PASSWORD:school123456}
    notify:
      enabled: false            # 接企微/钉钉 webhook 后置 true
      webhook-url: ${INTEGRATION_NOTIFY_WEBHOOK_URL:}
    ticket:
      provider: local           # local=本地 jsonl 兜底；接入真实工单系统时替换实现
  llm:
    provider: ${MARKAGENT_LLM_PROVIDER:deepseek-direct}   # deepseek-direct | bailian
    default-model: ${MARKAGENT_LLM_MODEL:deepseek-flash}
  embedding:
    enabled: ${MARKAGENT_EMBEDDING_ENABLED:true}          # 无 embedding key 时置 false → 关键词检索降级
    provider: ${MARKAGENT_EMBEDDING_PROVIDER:bailian-compatible}
  context:
    max-tokens: 1000000
    compact-threshold: 0.75
  security:
    jwt:
      secret: ${MARKAGENT_JWT_SECRET:}
      ttl-hours: 72
    bootstrap-admin:
      username: admin
      password: ${MARKAGENT_ADMIN_PASSWORD:admin123}
  web:
    static-locations: classpath:/static/
  mcp:
    stdio-timeout-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.markagent: INFO
    io.agentscope: DEBUG
